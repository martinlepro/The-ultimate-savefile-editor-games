# À chaque envoi sur main : valide le pack, recalcule les empreintes et incrémente la version dans manifest.json.
# Vous pouvez donc modifier un fichier directement sur github.com : l'application proposera la mise à jour.
name: Manifest

on:
  push:
    branches: [main]
    paths-ignore: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider et recalculer le manifeste
        run: python3 tools/make_manifest.py
      - name: Publier manifest.json si nécessaire
        run: |
          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "manifest: version et empreintes [skip ci]"
            git push
          else
            echo "manifest.json déjà à jour"
          fi
